[package]
name = "SmartSave_MVP"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = {version ="1.0", features = ["derive"]}
serde_json = "1.0"
uuid = {version ="1.0", features = ["v4", "serde"]}
chrono = {version = "0.4", features = ["serde"]}
actix-web = "4"
actix-rt ="2.5"
dotenv = "0.15"
sqlx = { version = "0.8.3", features = ["postgres", "macros", "chrono", "uuid"] }
